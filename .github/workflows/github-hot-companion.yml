name: GitHub HOT companion (hourly YouTube view sampling)
on:
  schedule:
    # Use batched YouTube videos.list to poll fresh views hourly when secret is configured.
    - cron: '17 5-20 * * *'
      timezone: Europe/Kyiv
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/github-hot-companion.yml'
      - 'scripts/github-hot-bridge.mjs'
      - 'tests/github-hot-bridge.test.mjs'
      - 'tests/github-hot-large-json.test.mjs'
      - 'site-integration/hot-hourly.mjs'
permissions:
  contents: write
concurrency:
  group: github-hot-companion
  cancel-in-progress: false
jobs:
  recalculate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify estimated and measured growth calculations
        run: node --test site-integration/tests/hot-hourly.test.mjs tests/github-hot-bridge.test.mjs tests/github-hot-large-json.test.mjs
      - name: Read original Site feed and publish ranked GitHub companion
        env:
          GH_BRIDGE_TOKEN: ${{ github.token }}
          # Configure via repository Settings → Secrets and variables → Actions.
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/github-hot-bridge.mjs
