name: Azeroth Radar parity release live verification (one-time)
on:
  push:
    paths:
      - '.github/workflows/parity-live-verification-once.yml'
permissions:
  contents: none
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify deployed public feed, theme, research protection and 48h catalog
        shell: python {0}
        run: |
          import urllib.request,urllib.error,json
          base='https://azeroth-radar.azeroth-radar-gorthax.workers.dev'
          def get(path):
            req=urllib.request.Request(base+path,headers={'User-Agent':'AzerothRadar-LiveParity/1.0','Accept':'application/json,text/plain,text/javascript,text/html'})
            with urllib.request.urlopen(req,timeout=40) as r:return r.status,r.read()
          code,homepage=get('/')
          print('Homepage:',code,'bytes:',len(homepage))
          assert code==200 and b'Azeroth Radar' in homepage
          code,js=get('/app.js')
          print('App JS:',code,'bytes:',len(js),'Settings UI:',b'settingsSection' in js,'Blackrock toggle:',b'theme-brd' in js)
          assert code==200 and b'settingsSection' in js and b'theme-brd' not in js
          code,html=get('/style.css')
          assert code==200 and b"data-theme='brd'" not in html
          code,health=get('/api/health')
          h=json.loads(health)
          print('Health:',code,h.get('ok'),h.get('database'))
          assert code==200 and h.get('ok')
          code,body=get('/api/feed')
          f=json.loads(body)
          hot=f.get('hot',{});popular=f.get('popular',{})
          print('Feed:',code,'HOT long',len(hot.get('long',[])),'HOT shorts',len(hot.get('shorts',[])),'POPULAR long',len(popular.get('long',[])),'POPULAR shorts',len(popular.get('shorts',[])),'STORIES',len(f.get('stories',[])),'source statuses',f.get('sources'))
          old=[x for x in popular.get('long',[])+popular.get('shorts',[]) if f['generatedAt']-x['publishedAt']>=24*3600000]
          print('Popular tracked 24–48h:',len(old))
          print('Official sources returned:',len(f.get('officialSources',[])))
          print('New research statuses:',f.get('researchStatuses'))
          print('Safe discovery config:',f.get('discoverySettings',{}).get('channelCount'))
          assert code==200 and hot.get('long') is not None and popular.get('long') is not None and isinstance(f.get('stories'),list)
          assert f.get('savedPrivate') is True and f.get('canManage') is False
          code,cfg=get('/api/discovery/config')
          c=json.loads(cfg)
          print('Discovery config:',code,'queries',len(c.get('queries',[])),'channels',len(c.get('channels',[])))
          assert code==200 and c.get('englishOnly') is True
          req=urllib.request.Request(base+'/api/channels',data=b'{"id":"UCbLj9QP9FAaHs_647QckGtg"}',headers={'Content-Type':'application/json'},method='POST')
          try:
            urllib.request.urlopen(req,timeout=20)
            raise AssertionError('Unauthenticated channel mutation unexpectedly succeeded')
          except urllib.error.HTTPError as e:
            print('Unauthorized channel mutation:',e.code)
            assert e.code in (401,503)
