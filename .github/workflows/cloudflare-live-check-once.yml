name: One-time Cloudflare TLS and live acceptance verification
on:
  push:
    paths:
      - '.github/workflows/cloudflare-live-check-once.yml'
permissions:
  contents: none
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify Worker route and account subdomain enabled through Cloudflare API
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: python {0}
        run: |
          import os,json,urllib.request
          token=os.environ['TOKEN']
          def get(path):
            req=urllib.request.Request('https://api.cloudflare.com/client/v4/'+path,headers={
              'Authorization':'Bearer '+token,'Accept':'application/json','User-Agent':'AzerothRadar-Verify/1.0'})
            with urllib.request.urlopen(req,timeout=20) as r:return json.loads(r.read())
          accounts=get('accounts?per_page=50')['result']
          if len(accounts)!=1: raise SystemExit('Need exactly one Cloudflare account')
          a=accounts[0]['id']
          domain=get('accounts/'+a+'/workers/subdomain')
          worker=get('accounts/'+a+'/workers/scripts/azeroth-radar/subdomain')
          print('Cloudflare account subdomain:',domain.get('result',{}).get('subdomain'))
          print('Worker route enabled:',worker.get('result',{}).get('enabled'))
          print('Preview URL enabled:',worker.get('result',{}).get('previews_enabled'))
      - name: Retry TLS and check public homepage plus APIs
        shell: bash
        run: |
          BASE='https://azeroth-radar.azeroth-radar-gorthax.workers.dev'
          ready=0
          for i in $(seq 1 15); do
            if curl -fsS --max-time 12 "$BASE/api/health" -o /tmp/radar-health.json 2>/tmp/radar-tls.log; then ready=1; break; fi
            echo "HTTPS not ready, attempt $i; retrying"
            sleep 4
          done
          if [ "$ready" != 1 ]; then
            echo 'Public HTTPS endpoint not responding successfully.'
            sed -E 's/(Bearer |token=)[^ ]+/\1[REDACTED]/g' /tmp/radar-tls.log
            exit 1
          fi
          node -e "const h=require('/tmp/radar-health.json'); if(!h.ok || h.database!=='d1')process.exit(1);console.log('Worker health:',h.platform,'D1:',h.database)"
          curl -fsS --max-time 25 "$BASE/" -o /tmp/radar-home.html
          grep -qi 'Azeroth Radar' /tmp/radar-home.html
          curl -fsS --max-time 35 "$BASE/api/feed" -o /tmp/radar-feed.json
          node -e "const f=require('/tmp/radar-feed.json'); if(!f.hot||!f.popular||!Array.isArray(f.stories))process.exit(1); console.log('Live site feed: HOT long',f.hot.long.length,'HOT shorts',f.hot.shorts.length,'POPULAR long',f.popular.long.length,'POPULAR shorts',f.popular.shorts.length,'STORIES',f.stories.length)"
