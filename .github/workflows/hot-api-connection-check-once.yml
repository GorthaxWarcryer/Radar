name: One-time GitHub HOT API connection check
on:
  push:
    paths:
      - '.github/workflows/hot-api-connection-check-once.yml'
permissions:
  actions: write
  contents: none
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Start existing hourly HOT workflow once
        shell: python {0}
        env:
          GH_RUN_TOKEN: ${{ github.token }}
        run: |
          import json, os, urllib.request
          target = 'https://api.github.com/repos/GorthaxWarcryer/Radar/actions/workflows/github-hot-companion.yml/dispatches'
          data = json.dumps({'ref':'main'}).encode('utf-8')
          req = urllib.request.Request(target, data=data, method='POST', headers={
              'Authorization':'Bearer '+os.environ['GH_RUN_TOKEN'],
              'Accept':'application/vnd.github+json',
              'Content-Type':'application/json',
              'X-GitHub-Api-Version':'2022-11-28',
              'User-Agent':'AzerothRadar-API-Connection-Check'
          })
          with urllib.request.urlopen(req,timeout=25) as response:
              if response.status != 204:
                  raise RuntimeError('Dispatch failed with HTTP '+str(response.status))
              print('Original GitHub HOT workflow dispatched for live API test.')
