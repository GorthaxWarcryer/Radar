name: One-time Cloudflare deployment after domain bootstrap
on:
  push:
    paths:
      - '.github/workflows/cloudflare-deploy-dispatch-once.yml'
permissions:
  actions: write
  contents: none
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch verified Cloudflare production deploy
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python {0}
        run: |
          import json,os,urllib.request
          url='https://api.github.com/repos/GorthaxWarcryer/Radar/actions/workflows/cloudflare-deploy.yml/dispatches'
          req=urllib.request.Request(url,method='POST',data=json.dumps({'ref':'main'}).encode(),headers={
            'Authorization':'Bearer '+os.environ['GH_TOKEN'],
            'Accept':'application/vnd.github+json','Content-Type':'application/json',
            'X-GitHub-Api-Version':'2022-11-28','User-Agent':'AzerothRadar-Cloudflare-Deploy'})
          with urllib.request.urlopen(req,timeout=25) as r:
            if r.status!=204: raise SystemExit('Deployment dispatch failed HTTP '+str(r.status))
            print('Cloudflare deployment launched.')
