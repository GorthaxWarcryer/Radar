name: One-time Cloudflare account autodiscovery test
on:
  push:
    paths:
      - '.github/workflows/cloudflare-deploy-dispatch-once.yml'
permissions:
  contents: none
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Try discovering account ID using existing private Cloudflare token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: python {0}
        run: |
          import os,json,urllib.request,urllib.error
          token=os.environ.get('CLOUDFLARE_API_TOKEN','')
          if not token: raise SystemExit('Missing Cloudflare API token')
          for url in ['https://api.cloudflare.com/client/v4/accounts?per_page=5']:
            req=urllib.request.Request(url,headers={'Authorization':'Bearer '+token,'Accept':'application/json','User-Agent':'AzerothRadar-Setup/1.0'})
            try:
              with urllib.request.urlopen(req,timeout=20) as res:
                data=json.loads(res.read().decode())
                rows=data.get('result',[])
                ids=[x.get('id','') for x in rows]
                good=[i for i in ids if isinstance(i,str) and len(i)==32]
                print('Cloudflare account API status: HTTP '+str(res.status))
                print('Cloudflare accessible account count: '+str(len(good)))
                print('Can auto-select one account: '+str(len(good)==1).lower())
            except urllib.error.HTTPError as e:
              print('Cloudflare account API status: HTTP '+str(e.code))
              print('Account ID cannot be read from this token')
