name: One-time Cloudflare deployment dispatcher
# Retry after supporting an Account ID stored as a GitHub variable.
on:
  push:
    paths:
      - '.github/workflows/cloudflare-deploy-dispatch-once.yml'
permissions:
  actions: write
  contents: none
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Trigger existing approved Cloudflare deployment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python {0}
        run: |
          import json,os,urllib.request
          url='https://api.github.com/repos/GorthaxWarcryer/Radar/actions/workflows/cloudflare-deploy.yml/dispatches'
          req=urllib.request.Request(url,method='POST',data=json.dumps({'ref':'main'}).encode(),headers={
            'Authorization':'Bearer '+os.environ['GH_TOKEN'],
            'Accept':'application/vnd.github+json',
            'Content-Type':'application/json',
            'X-GitHub-Api-Version':'2022-11-28',
            'User-Agent':'AzerothRadar-Cloudflare-Deploy'
          })
          with urllib.request.urlopen(req,timeout=25) as response:
            if response.status!=204: raise RuntimeError('Dispatch failed HTTP '+str(response.status))
            print('Cloudflare deploy workflow dispatched.')
