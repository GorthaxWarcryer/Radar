name: One-time Cloudflare credential presence check
on:
  push:
    paths:
      - '.github/workflows/cloudflare-deploy-dispatch-once.yml'
permissions:
  contents: none
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check Cloudflare credential presence without exposing their values
        env:
          HAS_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT_SECRET: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
          HAS_ACCOUNT_VARIABLE: ${{ vars.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          echo "Cloudflare API token present: $HAS_API_TOKEN"
          echo "Cloudflare account ID secret present: $HAS_ACCOUNT_SECRET"
          echo "Cloudflare account ID variable present: $HAS_ACCOUNT_VARIABLE"
