name: Final Azeroth snapshot and duplicate-slot verification
on:
  push:
    paths: ['.github/workflows/azeroth-refresh-dispatch-test.yml']
permissions:
  actions: write
  contents: none
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Dispatch two bounded recovery slices
        shell: python {0}
        run: |
          import os, json, urllib.request
          url = 'https://api.github.com/repos/GorthaxWarcryer/Radar/actions/workflows/azeroth-site-refresh.yml/dispatches'
          req = urllib.request.Request(url, data=json.dumps({'ref':'main','inputs':{'max_slices':'2'}}).encode(), headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json','User-Agent':'AzerothRadar-Recovery-Test/1.0'})
          with urllib.request.urlopen(req, timeout=30) as response:
              assert response.status == 204
          print('Manual workflow_dispatch accepted; independent persisted-state readback requested.')
