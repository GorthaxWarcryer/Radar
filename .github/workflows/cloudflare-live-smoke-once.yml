name: One-time Cloudflare live acceptance check
on:
  push:
    paths:
      - '.github/workflows/cloudflare-live-smoke-once.yml'
permissions:
  contents: none
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify published frontend, D1 and public API
        shell: python {0}
        run: |
          import urllib.request, json, time
          base='https://azeroth-radar.azeroth-radar-gorthax.workers.dev'
          def get(path):
              req=urllib.request.Request(base+path,headers={'User-Agent':'AzerothRadar-LiveVerify/1.0','Accept':'*/*'})
              with urllib.request.urlopen(req,timeout=35) as r:
                  return r.status,r.headers.get('content-type',''),r.read(2000000)
          for path in ['/', '/api/health', '/api/feed']:
              status,ctype,data=get(path)
              print('LIVE',path,'status='+str(status),'content-type='+ctype,'bytes='+str(len(data)))
              assert status==200, (path,status)
              if path=='/':
                  assert b'Azeroth Radar' in data, 'Homepage branding missing'
                  assert b'<html' in data.lower(), 'Homepage HTML missing'
              if path=='/api/health':
                  j=json.loads(data)
                  print('HEALTH',json.dumps({k:j.get(k) for k in ['ok','platform','database','originalSiteConnected']}))
                  assert j.get('ok') is True and j.get('platform')=='cloudflare-workers' and j.get('database')=='d1'
              if path=='/api/feed':
                  j=json.loads(data)
                  assert isinstance(j.get('hot'),dict) and isinstance(j.get('popular'),dict)
                  print('FEED',json.dumps({'HOTlong':len(j['hot'].get('long',[])),'HOTshorts':len(j['hot'].get('shorts',[])),'PopularLong':len(j['popular'].get('long',[])),'PopularShorts':len(j['popular'].get('shorts',[])),'Stories':len(j.get('stories',[])),'summary':j.get('summary')}))
          print('SUCCESS: Cloudflare production URL and critical APIs are reachable')
