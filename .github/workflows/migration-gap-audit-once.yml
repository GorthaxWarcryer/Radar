name: One-time original vs Cloudflare public feature audit
on:
  push:
    paths:
      - '.github/workflows/migration-gap-audit-once.yml'
permissions:
  contents: none
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Compare public non-sensitive Site and Cloudflare API schemas
        shell: python {0}
        run: |
          import urllib.request,urllib.error,json
          sites={
            'original':'https://azeroth-radar-petro.gorthax.chatgpt.site',
            'cloudflare':'https://azeroth-radar.azeroth-radar-gorthax.workers.dev'
          }
          paths=['/','/api/feed?view=dashboard','/api/health']
          for site,base in sites.items():
            print('=== '+site+' ===')
            for path in paths:
              try:
                req=urllib.request.Request(base+path,headers={'User-Agent':'AzerothRadar-ReadOnly-Migration-Audit/1.0','Accept':'application/json,text/html'})
                with urllib.request.urlopen(req,timeout=24) as resp:
                  code=resp.status; typ=resp.headers.get('content-type',''); data=resp.read(5000000)
                print(path,'HTTP',code,'bytes',len(data),'content-type',typ)
                if 'json' in typ or path.startswith('/api/'):
                  try:
                    parsed=json.loads(data)
                    print('top-level-keys',sorted(parsed.keys()) if isinstance(parsed,dict) else type(parsed).__name__)
                    if isinstance(parsed,dict):
                      for k in ['rankings','hot','popular','storyColumns']:
                        section=parsed.get(k)
                        if isinstance(section,dict):
                          counts={}
                          for kind,collection in section.items():
                            if isinstance(collection,list): counts[kind]=len(collection)
                            elif isinstance(collection,dict): counts[kind]={name:len(v) for name,v in collection.items() if isinstance(v,list)}
                          print('  '+k+' counts',counts)
                      for k in ['contentCreation','bluePosts','formatCounts']:
                        section=parsed.get(k)
                        if isinstance(section,dict):
                          print('  '+k+' list-counts',{name:len(v) for name,v in section.items() if isinstance(v,list)})
                      if isinstance(parsed.get('config'),dict):
                        c=parsed['config']
                        print('  discovery-settings:',{k:len(v) if isinstance(v,list) else v for k,v in c.items() if k in ['queries','englishOnly','excludeRussian']})
                      if isinstance(parsed.get('health'),dict):
                        h=parsed['health']; print('  health-flags',{k:h.get(k) for k in ['automationActive','sleeping','stale','discoveryStale','recoveryStalled','trackedVideos'] if k in h})
                      for k in ['canManage','connected']:
                        if k in parsed:print('  public-flag '+k,parsed[k])
                    if isinstance(parsed,dict):
                      for key in ['videos','stories','channels','scans','savedVideos','saved','contentCreation','popular','hot','reddit','bluePosts','storyColumns','health','config','sources','summary']:
                        item=parsed.get(key)
                        if isinstance(item,list): print('  '+key,'list-count',len(item))
                        elif isinstance(item,dict): print('  '+key,'object-keys',sorted(item.keys())[:35])
                  except ValueError: print('body not JSON')
                elif path=='/':
                  print('homepage HTML fingerprint: has app root',b'__next' in data or b'__VINEXT' in data,'has Azeroth Radar',b'Azeroth Radar' in data)
              except urllib.error.HTTPError as e: print(path,'HTTP',e.code)
              except Exception as e: print(path,'failed',type(e).__name__,str(e)[:110])
