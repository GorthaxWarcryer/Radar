name: Publish Azeroth Radar to Cloudflare (opt-in)
on:
  workflow_dispatch:
  push:
    paths:
      - 'cloudflare/**'
      - 'wrangler.jsonc'
      - 'public/**'
      - '.github/workflows/cloudflare-deploy.yml'
permissions:
  contents: read
concurrency:
  group: azeroth-cloudflare-deploy
  cancel-in-progress: false
jobs:
  deploy:
    # Manual, explicitly tagged [deploy] commits, or opt-in repository variable only.
    if: ${{ github.event_name == 'workflow_dispatch' || vars.CLOUDFLARE_AUTO_DEPLOY == 'true' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: cloudflare-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run migration tests
        run: |
          node --check cloudflare/worker.mjs
          node --check public/app.js
          node --test cloudflare/tests/*.test.mjs tests/reddit-directory.test.mjs tests/ux-dashboard.test.mjs
      - name: Resolve Cloudflare account automatically from private API token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID_CONFIGURED: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        shell: python {0}
        run: |
          import json,os,urllib.request,re
          token=os.environ.get('CLOUDFLARE_API_TOKEN','')
          if not token: raise SystemExit('Missing CLOUDFLARE_API_TOKEN GitHub Actions secret')
          account=os.environ.get('ACCOUNT_ID_CONFIGURED','').strip()
          if not account:
            req=urllib.request.Request('https://api.cloudflare.com/client/v4/accounts?per_page=50',headers={
              'Authorization':'Bearer '+token,'Accept':'application/json','User-Agent':'AzerothRadar-Deploy/1.0'})
            with urllib.request.urlopen(req,timeout=25) as resp:
              result=json.loads(resp.read().decode())
            accounts=result.get('result',[])
            if not result.get('success') or len(accounts)!=1:
              raise SystemExit('Cannot auto-select Cloudflare account; set CLOUDFLARE_ACCOUNT_ID in GitHub Actions Secrets')
            account=accounts[0].get('id','')
          if not re.fullmatch(r'[0-9a-fA-F]{32}',account):
            raise SystemExit('Cloudflare Account ID format is invalid')
          print('::add-mask::'+account)
          with open(os.environ['GITHUB_ENV'],'a') as f: f.write('CLOUDFLARE_ACCOUNT_ID='+account+'\n')
          print('Cloudflare account identified; continuing to D1 setup and deployment.')
      - name: Find or create D1 database and bind its real Cloudflare ID
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node cloudflare/bootstrap-d1.mjs
      - name: Initialize or upgrade remote D1 schema before publishing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4 d1 execute azeroth-radar-db --remote --file=./cloudflare/schema.sql --config wrangler.jsonc --yes
      - name: Backfill live blue posts immediately after schema setup
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node cloudflare/seed-blue.mjs
          npx --yes wrangler@4 d1 execute azeroth-radar-db --remote --file=./.blue-posts-seed.sql --config wrangler.jsonc --yes
      - name: Register first workers.dev hostname only if account has none
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node cloudflare/ensure-subdomain.mjs
      - name: Deploy Worker and static website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4 deploy --config wrangler.jsonc
      - name: Configure optional private admin token if supplied
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RADAR_ADMIN_TOKEN: ${{ secrets.RADAR_ADMIN_TOKEN }}
        run: |
          if [ -n "$RADAR_ADMIN_TOKEN" ]; then
            if [ "${#RADAR_ADMIN_TOKEN}" -lt 32 ]; then echo 'RADAR_ADMIN_TOKEN must be 32+ characters'; exit 1; fi
            printf '%s' "$RADAR_ADMIN_TOKEN" | npx --yes wrangler@4 secret put ADMIN_TOKEN --config wrangler.jsonc
            echo 'Administrator secret configured without printing its value.'
          else
            echo 'Private administrator features remain locked until RADAR_ADMIN_TOKEN secret is configured.'
          fi
      - name: Verify deployed Worker D1 and public feed
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx --yes wrangler@4 d1 execute azeroth-radar-db --remote --command='SELECT COUNT(*) AS count FROM videos;' --config wrangler.jsonc --yes
          echo 'Cloudflare Worker deployed; inspect the Wrangler deploy output for its workers.dev URL.'
      - name: Verify live design assets and feed after publish
        shell: bash
        run: |
          python3 - <<'PY'
          import json,urllib.request
          base='https://azeroth-radar.azeroth-radar-gorthax.workers.dev'
          def get(path):
            request=urllib.request.Request(base+path,headers={'User-Agent':'AzerothRadar-LiveDesignSmoke/1.0'})
            with urllib.request.urlopen(request,timeout=35) as response:
              if response.status!=200:raise RuntimeError(path+' HTTP '+str(response.status))
              return response.read().decode('utf-8')
          html=get('/')
          assert 'class="skip-link"' in html and 'id="refresh-feed"' in html, 'Accessible header missing'
          js=get('/app.js')
          assert "hotSort:'velocity', popularSort:'views'" in js, 'Mode-specific sorting missing'
          assert "event.key==='/'" in js and 'function redditDirectory()' in js, 'Search/Reddit UI missing'
          css=get('/style.css')
          assert 'Azeroth Radar 2026 interface refinement' in css, 'Refreshed stylesheet not deployed'
          assert 'prefers-reduced-motion:reduce' in css, 'Reduced motion support missing'
          feed=json.loads(get('/api/feed'))
          assert 'hot' in feed and 'popular' in feed and isinstance(feed.get('stories'),list), 'Public feed unavailable'
          print('LIVE UX PASS: homepage, fonts/styles, accessible controls, HOT/Popular/Reddit UI, JSON feed')
          print('Live source counts:',json.dumps({'hotLong':len(feed['hot'].get('long',[])),'hotShorts':len(feed['hot'].get('shorts',[])),'popularLong':len(feed['popular'].get('long',[])),'stories':len(feed['stories'])}))
          PY
      - name: Deployment confirmation
        run: echo 'Cloudflare deployment and D1 schema completed. Verify the Worker URL in the deployment output and GET /api/health.'
