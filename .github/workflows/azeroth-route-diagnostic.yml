name: Azeroth Site route diagnostic (no credentials)
on:
  push:
    paths:
      - '.github/workflows/azeroth-route-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: none
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check public routing and sanitized redirect destination
        shell: python {0}
        run: |
          import urllib.request, urllib.error, urllib.parse
          base = 'https://azeroth-radar-petro.gorthax.chatgpt.site'
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          client = urllib.request.build_opener(NoRedirect)
          for method, path in [('GET','/'), ('GET','/api/feed'), ('POST','/api/refresh')]:
              url = base + path
              data = b'{}' if method == 'POST' else None
              req = urllib.request.Request(url, data=data, method=method, headers={'Content-Type':'application/json','User-Agent':'AzerothRadar-Diagnostic/1.0'})
              try:
                  with client.open(req, timeout=15) as response:
                      code, headers = response.status, response.headers
              except urllib.error.HTTPError as exc:
                  code, headers = exc.code, exc.headers
              except Exception as exc:
                  print(method, path, 'network failure:', type(exc).__name__)
                  continue
              loc = headers.get('Location','')
              if loc:
                  target = urllib.parse.urlsplit(urllib.parse.urljoin(url,loc))
                  # Print only host/path, never redirect queries, fragments, or secrets.
                  print(method, path, 'HTTP',code,'redirect_host',target.hostname,'redirect_path',target.path)
              else:
                  print(method, path, 'HTTP',code,'no redirect')
