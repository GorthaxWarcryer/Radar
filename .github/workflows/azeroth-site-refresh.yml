name: Azeroth Site deterministic refresh
on:
  schedule:
    # Trigger seven minutes before each intended collection slot to avoid top-of-hour congestion.
    # The scheduled-only wait step below ensures the Site is never called before its slot opens.
    - cron: '53 4,7,10,13,16,19 * * *'
      timezone: Europe/Kyiv
  workflow_dispatch:
    inputs:
      max_slices:
        description: 'Bounded slices (2 for recovery test, 100 for normal collection)'
        type: choice
        default: '100'
        options: ['2', '100']
  push:
    paths: ['.github/workflows/azeroth-site-refresh.yml']
permissions:
  id-token: write
  contents: none
concurrency:
  group: azeroth-original-site-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MAX_SLICES: ${{ inputs.max_slices || '100' }}
    steps:
      - name: Wait for intended scan slot if the scheduler fires early
        if: ${{ github.event_name == 'schedule' }}
        shell: python {0}
        run: |
          # GitHub scheduled runners may start before or after the nominal collection hour.
          # Never invoke the Site before its daytime slot opens, even if GitHub is punctual.
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          import time
          tz = ZoneInfo('Europe/Kyiv')
          now = datetime.now(tz)
          slots = (5, 8, 11, 14, 17, 20)
          upcoming = [
              now.replace(hour=h, minute=0, second=0, microsecond=0)
              for h in slots
          ]
          early = [slot for slot in upcoming if timedelta(0) < slot - now <= timedelta(minutes=10)]
          if early:
              seconds = max(0, (early[0] - now).total_seconds())
              print(f'GitHub started early; waiting {seconds:.0f}s for the {early[0]:%H:%M} Kyiv collection slot.', flush=True)
              time.sleep(seconds)
          else:
              print('Collection slot already open or GitHub started late; proceeding now.', flush=True)
      - name: Collect and verify persisted data
        shell: python {0}
        run: |
          """Standard-library GitHub scheduler client. Never handles Site/API secrets."""
          import json
          import os
          import time
          import urllib.parse
          import urllib.request
          
          BASE = 'https://azeroth-radar-petro.gorthax.chatgpt.site'
          
          def request(operation):
              # Site verifier may still pin the original OIDC audience after host rename.
              audience = 'https://azeroth-radar-petro.honestrhino21.chatgpt.site/api/refresh'
              token_url = os.environ['ACTIONS_ID_TOKEN_REQUEST_URL'] + '&audience=' + urllib.parse.quote(audience, safe='')
              auth = urllib.request.Request(token_url, headers={'Authorization': 'Bearer ' + os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']})
              with urllib.request.urlopen(auth, timeout=20) as response:
                  token = json.load(response)['value']
              # Send token to the verified canonical Site, not to the legacy audience URL.
              req = urllib.request.Request(BASE + '/api/refresh', data=json.dumps({'operation': operation}).encode(), headers={'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json', 'User-Agent': 'AzerothRadar-Scheduler/1.0'})
              with urllib.request.urlopen(req, timeout=35) as response:
                  return json.load(response)
          
          def run(call=request, max_steps=100, clock=time.monotonic, sleep=time.sleep, emit=print):
              started = clock()
              identity = call('verify')
              if identity.get('status') != 'verified':
                  raise RuntimeError('Signed Site identity verification failed')
              if os.environ.get('GITHUB_EVENT_NAME') == 'push':
                  return {'outcome': 'identity-verified-only'}
              before = call('status')
              result = None
              for step in range(max(1, min(100, max_steps))):
                  if clock() - started >= 12 * 60:
                      break
                  result = call('youtube')
                  emit(json.dumps({k: result.get(k) for k in ['status', 'reason', 'stage', 'pending', 'sampled', 'retryAt', 'delayedMinutes']}))
                  status = result.get('status')
                  if status in ('error', 'disabled', 'unauthorized', 'verify-required', 'invalid-operation'):
                      raise RuntimeError('Collection failed: ' + status + ' — ' + str(result.get('reason', 'see Site status')))
                  if status == 'awaiting' and step > 0:
                      break
                  if status == 'awaiting':
                      raise RuntimeError('No collection: ' + str(result.get('reason', 'outside permitted execution')))
                  if result.get('lastFailureCode') and result.get('waiting'):
                      raise RuntimeError('Collection paused with saved work: ' + result['lastFailureCode'])
                  if status in ('already-complete', 'cooldown', 'sleeping') or not result.get('continuing'):
                      break
                  sleep(min(10, max(1, result.get('retryAfter', 1))))
              after = call('status')
              b, a = before.get('proof', {}), after.get('proof', {})
              previous_scan, current_scan = before.get('scan') or {}, after.get('scan') or {}
              calls = a.get('observedYouTubeCalls', 0) - b.get('observedYouTubeCalls', 0)
              snapshots = max(0, a.get('cycleSnapshots', 0) - (b.get('cycleSnapshots', 0) if previous_scan.get('scanId') == current_scan.get('scanId') else 0))
              checkpoint_advanced = (a.get('checkpointAt') or 0) > (b.get('checkpointAt') or 0)
              status = (result or {}).get('status')
              same_cycle = previous_scan.get('scanId') == current_scan.get('scanId')
              steps = current_scan.get('successfulSteps', 0) - (previous_scan.get('successfulSteps', 0) if same_cycle else 0)
              data_advanced = snapshots > 0 or steps > 0
              completing_saved_cycle = same_cycle and previous_scan.get('stage') in ('sampling', 'cleanup') and previous_scan.get('pending') == 0 and current_scan.get('stage') == 'complete' and (a.get('cycleSnapshots', 0) > 0 or previous_scan.get('lastFullDiscoveryAt') or previous_scan.get('successfulSteps', 0) > 0) and checkpoint_advanced
              if status in ('already-complete', 'cooldown', 'sleeping'):
                  outcome = {'already-complete': 'idempotent-slot-skip', 'cooldown': 'deferred-cooldown', 'sleeping': 'overnight-suppressed'}[status]
              elif completing_saved_cycle:
                  outcome = 'completed-saved-cycle'
              elif calls > 0 and checkpoint_advanced and data_advanced:
                  outcome = 'complete' if current_scan.get('stage') == 'complete' else 'partial-progress-saved'
                  if outcome == 'complete' and not snapshots and current_scan.get('sampled', 0) == 0:
                      outcome = 'complete-no-eligible-samples'
              else:
                  raise RuntimeError('No persisted collection progress: inspect Site checkpoint, lease and provider status')
              summary = {'outcome': outcome, 'event': os.environ.get('GITHUB_EVENT_NAME'), 'scanId': current_scan.get('scanId'), 'pendingBefore': previous_scan.get('pending'), 'pendingAfter': current_scan.get('pending'), 'newSnapshots': snapshots, 'observedYouTubeCalls': calls, 'cycleSnapshots': a.get('cycleSnapshots'), 'latestDiscoveryAt': current_scan.get('lastFullDiscoveryAt'), 'latestSnapshotAt': a.get('latestSnapshotAt'), 'checkpointAt': a.get('checkpointAt'), 'successfulSteps': steps, 'sampled': current_scan.get('sampled'), 'discovered': current_scan.get('discovered')}
              if outcome not in ('overnight-suppressed', 'deferred-cooldown'):
                  reddit = call('reddit')
                  summary['redditCoverage'] = reddit.get('status', 'unavailable')
              return summary
          
          if __name__ == '__main__':
              outcome = run(max_steps=int(os.environ.get('MAX_SLICES', '100')))
              text = json.dumps(outcome, indent=2)
              print('Persisted collection verification:\n' + text)
              summary_file = os.environ.get('GITHUB_STEP_SUMMARY')
              if summary_file:
                  with open(summary_file, 'a', encoding='utf-8') as f:
                      f.write('## Azeroth Radar refresh outcome\n```json\n' + text + '\n```\n')
      - name: Collect official Blizzard news independently
        if: ${{ always() && github.event_name != 'push' }}
        shell: python {0}
        run: |
          """Standard-library GitHub scheduler client. Never handles Site/API secrets."""
          import json
          import os
          import time
          import urllib.parse
          import urllib.request
          
          BASE = 'https://azeroth-radar-petro.gorthax.chatgpt.site'
          
          def request(operation):
              # Site verifier may still pin the original OIDC audience after host rename.
              audience = 'https://azeroth-radar-petro.honestrhino21.chatgpt.site/api/refresh'
              token_url = os.environ['ACTIONS_ID_TOKEN_REQUEST_URL'] + '&audience=' + urllib.parse.quote(audience, safe='')
              auth = urllib.request.Request(token_url, headers={'Authorization': 'Bearer ' + os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']})
              with urllib.request.urlopen(auth, timeout=20) as response:
                  token = json.load(response)['value']
              # Send token to the verified canonical Site, not to the legacy audience URL.
              req = urllib.request.Request(BASE + '/api/refresh', data=json.dumps({'operation': operation}).encode(), headers={'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json', 'User-Agent': 'AzerothRadar-Scheduler/1.0'})
              with urllib.request.urlopen(req, timeout=35) as response:
                  return json.load(response)
          
          request('verify')
          result = request('blizzard')
          readback = request('status').get('sources', {}).get('blizzard', {})
          print(json.dumps({'blizzard': result, 'persistedHealth': readback}, indent=2))
          if result.get('status') == 'complete' and (readback.get('lastSuccessAt') != result.get('lastSuccessAt') or readback.get('persisted') != result.get('persisted')):
              raise RuntimeError('Blizzard database readback mismatch')
          if result.get('status') in ('unavailable', 'busy', 'cooldown'):
              print('::warning::Blizzard coverage incomplete: ' + str(result.get('message', result.get('status'))))
          if result.get('status') in ('unauthorized', 'forbidden', 'verify-required', 'invalid-operation'):
              raise RuntimeError('Blizzard refresh authorization failed')
