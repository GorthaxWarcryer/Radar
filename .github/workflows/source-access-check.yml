name: Radar public source access check
on:
  push:
    paths: ['.github/workflows/source-access-check.yml']
permissions:
  actions: write
  contents: none
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Dispatch original refresh workflow
        shell: python {0}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          import os,json,urllib.request
          url='https://api.github.com/repos/GorthaxWarcryer/Radar/actions/workflows/azeroth-site-refresh.yml/dispatches'
          req=urllib.request.Request(url,data=json.dumps({'ref':'main','inputs':{'max_slices':'2'}}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
          with urllib.request.urlopen(req,timeout=20) as r:
            print('Dispatch status:',r.status)
