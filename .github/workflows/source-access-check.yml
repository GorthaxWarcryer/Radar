name: Radar public source access check
on:
  push:
    paths: ['.github/workflows/source-access-check.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check documented feed surfaces without credentials or block retries
        shell: python
        run: |
          import urllib.request, urllib.error
          urls = [
            'https://www.reddit.com/robots.txt',
            'https://www.reddit.com/r/wow/hot/.rss',
            'https://us.forums.blizzard.com/robots.txt',
            'https://us.forums.blizzard.com/en/wow/g/blizzard-tracker/activity/posts.rss',
            'https://worldofwarcraft.blizzard.com/robots.txt',
            'https://worldofwarcraft.blizzard.com/en-us/news/rss',
          ]
          for url in urls:
            try:
              r=urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'AzerothRadar/1.0 (public syndication availability check)','Accept':'application/rss+xml, application/atom+xml, text/plain'}),timeout=8)
              b=r.read(100000).decode('utf-8','replace')
              print(url, r.status, r.headers.get('Content-Type'), '\\n', b[:6500])
            except Exception as e:
              print(url, type(e).__name__, str(e))
