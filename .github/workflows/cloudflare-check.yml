name: Cloudflare migration regression checks
on:
  push:
    paths:
      - 'cloudflare/**'
      - 'public/**'
      - 'src/core.mjs'
      - 'src/intelligence.mjs'
      - 'tests/creator-intelligence.test.mjs'
      - 'scripts/github-hot-discover.mjs'
      - 'scripts/github-hot-bridge.mjs'
      - 'tests/content-opportunities.test.mjs'
      - 'tests/ux-dashboard.test.mjs'
      - 'wrangler.jsonc'
      - '.github/workflows/cloudflare-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate runtime and config syntax
        run: |
          node --check cloudflare/worker.mjs
          node --check cloudflare/ai-ideas.mjs
          node --check public/app.js
          node --check public/intelligence.js
          node --check src/intelligence.mjs
          node --check cloudflare/transform.mjs
          node -e "const fs=require('node:fs'); const x=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8')); if (!x.d1_databases || x.assets.directory!=='./public') throw Error('Invalid Cloudflare config')"
      - name: Test Cloudflare API, saved-data privacy and HOT growth
        run: node --test cloudflare/tests/*.test.mjs site-integration/tests/hot-hourly.test.mjs tests/reddit-directory.test.mjs tests/ux-dashboard.test.mjs tests/content-opportunities.test.mjs tests/creator-intelligence.test.mjs
      - name: Probe live WoW Forever blue-post RSS (diagnostic only)
        continue-on-error: true
        run: |
          node --input-type=module <<'NODE'
          import {fetchBluePosts} from './cloudflare/blue-posts.mjs';
          const posts = await fetchBluePosts(fetch,Date.now());
          console.log(JSON.stringify({source:'WoW Forever blue RSS',freshPosts:posts.length,
            sample:posts.slice(0,3).map(p=>({title:p.title,url:p.url,publishedAt:p.publishedAt}))}));
          if(!posts.length) throw new Error('No qualifying blue posts within 48h or RSS schema changed');
          NODE
      - name: Confirm Cloudflare Worker bundles without deploying
        run: npx --yes wrangler@4 deploy --dry-run --outdir=.wrangler/ci-check
      - name: Smoke-test actual local Worker and D1 API
        shell: bash
        run: |
          npx --yes wrangler@4 d1 execute azeroth-radar-db --local --file=./cloudflare/schema.sql
          npx --yes wrangler@4 dev --local --ip 127.0.0.1 --port 8787 >/tmp/azeroth-worker.log 2>&1 &
          worker_pid=$!
          trap 'kill $worker_pid 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 25); do
            if curl -fsS http://127.0.0.1:8787/api/health >/tmp/azeroth-health.json; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then cat /tmp/azeroth-worker.log; exit 1; fi
          node -e "const fs=require('node:fs');const h=JSON.parse(fs.readFileSync('/tmp/azeroth-health.json','utf8'));if (!h.ok||h.database!=='d1') process.exit(1)"
          curl -fsS http://127.0.0.1:8787/api/feed >/tmp/azeroth-feed.json
          node -e "const fs=require('node:fs');const f=JSON.parse(fs.readFileSync('/tmp/azeroth-feed.json','utf8'));if(!f.hot||!f.popular||!Array.isArray(f.stories))process.exit(1)"
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:8787/api/import)
          test "$status" = '503' || { echo "Unexpected anonymous import status $status"; exit 1; }
