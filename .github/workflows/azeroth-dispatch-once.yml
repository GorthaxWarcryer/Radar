name: One-time authorized Azeroth refresh dispatch
on:
  push:
    paths:
      - '.github/workflows/azeroth-dispatch-once.yml'
permissions:
  actions: write
  contents: none
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Trigger original Site workflow through its approved workflow_dispatch path
        shell: python {0}
        env:
          GH_RUN_TOKEN: ${{ github.token }}
        run: |
          import os, urllib.request, json
          target = 'https://api.github.com/repos/GorthaxWarcryer/Radar/actions/workflows/azeroth-site-refresh.yml/dispatches'
          body = json.dumps({'ref':'main','inputs':{'max_slices':'100'}}).encode('utf-8')
          req = urllib.request.Request(
            target, data=body, method='POST',
            headers={
              'Authorization':'Bearer '+os.environ['GH_RUN_TOKEN'],
              'Accept':'application/vnd.github+json',
              'Content-Type':'application/json',
              'X-GitHub-Api-Version':'2022-11-28',
              'User-Agent':'Azeroth-Radar-Authorized-Dispatch'
            }
          )
          with urllib.request.urlopen(req, timeout=25) as res:
              if res.status != 204:
                  raise RuntimeError('Unexpected workflow dispatch response: '+str(res.status))
              print('Original scheduler workflow_dispatch accepted (HTTP 204). No credentials disclosed.')
